name: CI

on:
  push:
    branches: ['**']
    tags: ['v**']

permissions:
  contents: read

env:
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: 4320

jobs:
  health:
    name: health (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test --experimental-test-coverage --test-coverage-include=lib/mod.ts
      - run: pnpm build
      - run: pnpm exec clean-publish --without-publish --temp-dir .publish --fields scripts,devDependencies,packageManager
      - run: npm pack --dry-run ./.publish

  # https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
  publish:
    needs: [health]
    name: publish
    runs-on: ubuntu-24.04-arm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # -> authentication
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check release version
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import pkg from './package.json' with { type: 'json' };
            assert.equal(process.env.GITHUB_REF_NAME, 'v' + pkg.version);
          "

      - run: pnpm exec clean-publish --without-publish --temp-dir .publish --fields scripts,devDependencies,packageManager

      - name: Stage npm release
        if: ${{ !contains(github.ref, '-next.') }}
        run: npm stage publish --provenance --access public
        working-directory: .publish

      - name: Stage npm prerelease
        if: ${{ contains(github.ref, '-next.') }}
        run: npm stage publish --tag next --provenance --access public
        working-directory: .publish
